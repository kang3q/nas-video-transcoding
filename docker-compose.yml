# 로컬 개발용 — 소스에서 v2 를 빌드합니다.
services:
  nvt2:
    build: .
    container_name: nvt2-dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /volume1/downloads:/media:ro
      - /volume1/downloads/_nvt:/output
      - /volume1/docker/nvt2/state:/state
    environment:
      TZ: Asia/Seoul
      NVT2_WORKERS: "1"
      NVT2_THREADS: "3"
