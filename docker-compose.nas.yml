# NAS 배포용. 이미지를 내려받기만 하므로 NAS 는 아무것도 컴파일하지 않습니다.
#
#   1. 이 파일 하나만 NAS 의 /volume1/docker/nvt/docker-compose.yml 로 복사
#   2. 아래 볼륨 경로 두 줄을 실제 경로로 수정
#   3. 캐시 폴더를 미리 만든다 (Synology 는 없는 경로를 자동 생성하지 않는다)
#        sudo mkdir -p /volume1/docker/nvt/cache
#   4. sudo docker compose up -d
#
# 업데이트는 sudo docker compose pull && sudo docker compose up -d
services:
  nvt:
    image: ghcr.io/kang3q/nas-video-transcoding:latest
    # ":latest" 가 로컬에 이미 있으면 Docker 는 다시 받지 않습니다.
    # 프로젝트를 지우고 다시 만들어도 이미지는 남으므로, 매번 레지스트리를
    # 확인하도록 해둡니다. compose 가 이 키를 거부하면 지우고
    # "docker compose pull" 을 수동으로 쓰세요.
    pull_policy: always
    container_name: nvt
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 원본 라이브러리. 읽기 전용으로 마운트합니다.
      - /volume1/downloads:/media:ro
      # 변환 결과물. 여유 공간이 있는 볼륨에 두세요.
      # 이 경로는 반드시 미리 존재해야 합니다. mkdir -p 를 먼저 실행하세요.
      - /volume1/docker/nvt/cache:/cache
    environment:
      TZ: Asia/Seoul
      # 플레이어가 이미 재생할 수 있는 코덱 목록.
      # 여기에 없는 코덱은 변환 대상이 됩니다.
      NVT_AUDIO_OK: "aac,mp3,mp2,flac,alac,opus,vorbis,pcm_s16le,pcm_s24le,pcm_u8"
      # 저사양 NAS 에서는 손실 인코더의 심리음향 모델이 전체 시간을 지배합니다.
      # J1900 실측(스테레오): AAC 4x, MP3 6x, FLAC 60x.
      # FLAC 은 무손실이라 재인코딩에도 음질 손실이 없습니다. 대신 용량이
      # 늘어납니다 (52분 에피소드 기준 대략 +300MB).
      NVT_AUDIO_CODEC: "flac"
      # 오디오 인코딩은 단일 스레드입니다. 재생 중인 파일과 다음 파일을
      # 동시에 처리하려면 2 이상이어야 합니다.
      # 영상 재인코딩(video 플랜)은 전 코어를 쓰므로, 그게 잦다면 1로 낮추세요.
      NVT_TRANSCODE_JOBS: "2"
      NVT_CACHE_MAX_GB: "100"
      # 외부에서 접속한다면 반드시 설정하세요.
      # NVT_USER: infuse
      # NVT_PASS: changeme
