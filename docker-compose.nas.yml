# v2 — NAS 배포용. 이미지를 내려받기만 하므로 NAS 는 아무것도 컴파일하지 않습니다.
#
#   1. 이 파일을 NAS 의 /volume1/docker/nvt2/docker-compose.yml 로 복사
#   2. 아래 볼륨 경로를 실제 경로로 확인
#   3. 출력·상태 폴더를 미리 만든다 (Synology 는 없는 경로를 자동 생성하지 않는다)
#        sudo mkdir -p /volume1/downloads/_nvt /volume1/docker/nvt2/state
#   4. 텔레그램 알림을 쓴다면 같은 폴더에 .env 를 만든다
#        curl -sO https://raw.githubusercontent.com/kang3q/nas-video-transcoding/main/.env.example
#        mv .env.example .env && vi .env
#   5. sudo docker compose up -d
#
# 그다음 브라우저에서 http://<나스IP>:8080 을 엽니다.
services:
  nvt2:
    image: ghcr.io/kang3q/nas-video-transcoding:latest
    pull_policy: always
    container_name: nvt2
    restart: unless-stopped
    # 종료 신호를 받으면 남은 큐를 기록하고 실행 중인 ffmpeg 을 정리합니다.
    # 기본 10초로는 모자랄 수 있습니다.
    stop_grace_period: 30s
    ports:
      # v1 을 나란히 돌린다면 겹치지 않게 왼쪽 숫자를 8081 등으로 바꾸세요.
      - "8080:8080"
    volumes:
      # 원본 라이브러리. 읽기 전용.
      - /volume1/downloads:/media:ro
      # 변환 결과물. 원본 폴더 안에 있어도 되며, 탐색 목록에서는 숨겨집니다.
      - /volume1/downloads/_nvt:/output
      # ffprobe 캐시와 실시간 재생용 임시 파일.
      - /volume1/docker/nvt2/state:/state
    environment:
      TZ: Asia/Seoul
      # H.264 인코딩은 J1900 에서 0.717x 로 측정됐습니다(29분 에피소드에 40분).
      # 워커를 늘려도 전체가 느려질 뿐이라 1 로 둡니다.
      NVT2_WORKERS: "1"
      NVT2_THREADS: "3"
      NVT2_PRESET: "superfast"
      NVT2_VIDEO_BITRATE: "2600k"
      NVT2_AUDIO_BITRATE: "320k"
      # 배치의 첫 파일이 이만큼 진행되면 결과를 확인할 기회를 줍니다.
      NVT2_CHECKPOINT_PERCENT: "10"
      # 변환 중에도 볼 수 있게 HLS 를 함께 만듭니다. 인코딩은 한 번만 돌고
      # 디스크만 잠시 더 씁니다. 작업이 끝나면 지워집니다.
      NVT2_LIVE: "true"
      # 첫 파일이 10% 를 지나면 텔레그램으로 알리고, 거기서 나머지를 중단할 수
      # 있습니다. 봇이 텔레그램을 주기적으로 조회하는 방식이라 포트포워딩 없이
      # 집 밖에서도 동작합니다.
      #
      # 값은 이 파일이 아니라 **이 파일과 같은 폴더의 .env** 에 적습니다.
      # .env 는 커밋되지 않으므로 토큰이 실수로 저장소에 들어갈 일이 없습니다.
      #
      # .env 가 없으면 세 값이 빈 문자열이 되고 알림은 조용히 꺼집니다.
      # 그때 compose 가 "variable is not set" 경고를 찍고, 컨테이너 로그
      # 첫 줄들에도 "telegram: off" 가 남습니다. 둘 중 하나라도 보이면
      # .env 가 없거나 다른 폴더에 있는 것입니다.
      NVT2_TELEGRAM_TOKEN: "${NVT2_TELEGRAM_TOKEN}"
      NVT2_TELEGRAM_CHAT_ID: "${NVT2_TELEGRAM_CHAT_ID}"
      NVT2_PUBLIC_URL: "${NVT2_PUBLIC_URL}"
      # 외부에서 접속한다면 반드시 설정하세요.
      # NVT2_USER: nvt
      # NVT2_PASS: changeme
