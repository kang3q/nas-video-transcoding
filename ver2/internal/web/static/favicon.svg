<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A frame of film with a play mark in it. Drawn rather than photographed
       so it stays sharp at 16px, where a scaled-down picture turns to mud. -->
  <rect width="32" height="32" rx="7" fill="#1c1b19"/>
  <g fill="#6b6864">
    <rect x="4" y="7" width="3" height="3" rx="1"/>
    <rect x="4" y="14.5" width="3" height="3" rx="1"/>
    <rect x="4" y="22" width="3" height="3" rx="1"/>
    <rect x="25" y="7" width="3" height="3" rx="1"/>
    <rect x="25" y="14.5" width="3" height="3" rx="1"/>
    <rect x="25" y="22" width="3" height="3" rx="1"/>
  </g>
  <path d="M13 11.5 L22 16 L13 20.5 Z" fill="#fbfbfa"/>
</svg>
